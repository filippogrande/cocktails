services:
  cocktails:
    build: .
    image: cocktails-site:latest
    container_name: cocktails-site
    ports:
      - "10.0.0.5:8096:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
